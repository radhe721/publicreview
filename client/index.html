    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Open Graph & Social Cards -->
    <meta property="og:type" content="website" />

    <meta name="twitter:description" content="Discover, rate, and stress-test raw product ideas in an open, ranked community ledger where the list is the hero." />

    <!-- Plus Jakarta Sans Font with font-display: swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet" />

    <!-- Pre-paint Theme Script: eliminates flash of wrong theme -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('ideapulse_theme') || 'system';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored === 'dark' || (stored === 'system' && prefersDark);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.classList.remove('light');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.add('light');
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
          }
          var metaThemeColor = document.getElementById('meta-theme-color');
          if (metaThemeColor) {
            metaThemeColor.setAttribute('content', isDark ? '#121417' : '#FFFFFF');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="min-h-screen bg-bg text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
